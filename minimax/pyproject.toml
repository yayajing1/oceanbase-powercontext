[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-context"
version = "1.0.0"
description = "SDD context management module for the MiniMax x OceanBase competition entry"
requires-python = ">=3.11"
dependencies = [
    "pymysql>=1.2,<1.3",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
state = ["powercontext[builtin]==1.2.0"]
test = ["pytest>=8,<10"]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[tool.setuptools]
packages = ["sdd_context"]
